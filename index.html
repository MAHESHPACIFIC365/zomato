
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>jQuery Practice</title>

    <!-- jQuery CDN -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        section {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px #ddd;
        }

        h1 {
            text-align: center;
        }

        button {
            padding: 10px 20px;
            background: #222;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        /* TASK 1 */

        #status {
            background: #eee;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        /* TASK 2 */

        #search {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .restaurant {
            padding: 12px;
            background: #f1f1f1;
            margin: 5px 0;
            border-radius: 5px;
        }

        /* TASK 3 */

        .product-card {
            width: 300px;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .product-image {
            height: 150px;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .product-name {
            font-size: 20px;
            font-weight: bold;
        }

        .price {
            font-size: 18px;
            margin: 10px 0;
        }

        #description {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 5px;
            line-height: 1.5;
        }

        /* TASK 4 */

        select {
            width: 100%;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .song {
            background: #f1f1f1;
            padding: 12px;
            margin-top: 8px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>jQuery Practice</h1>


    <!-- =================================
         TASK 1
    ================================== -->

    <section>

        <h2>1. Online Status</h2>

        <div id="status">
            You are currently offline.
        </div>

        <button id="goOnline">
            Go Online
        </button>

    </section>


    <!-- =================================
         TASK 2
    ================================== -->

    <section>

        <h2>2. 🍽️ Restaurant Search</h2>

        <input
            type="text"
            id="search"
            placeholder="Search restaurant..."
        >

        <div class="restaurant">
            Pizza Hut
        </div>

        <div class="restaurant">
            Domino's Pizza
        </div>

        <div class="restaurant">
            McDonald's
        </div>

        <div class="restaurant">
            Burger King
        </div>

        <div class="restaurant">
            Subway
        </div>

        <div class="restaurant">
            Honest Restaurant
        </div>

        <div class="restaurant">
            La Pino's Pizza
        </div>

    </section>


    <!-- =================================
         TASK 3
    ================================== -->

    <section>

        <h2>3. 🛒 Product Card</h2>

        <div class="product-card">

            <div class="product-image">
                🎧
            </div>

            <div class="product-name">
                Wireless Headphones
            </div>

            <div class="price">
                ₹2,499
            </div>

            <button id="showDetails">
                Show Details
            </button>

            <div id="description"></div>

        </div>

    </section>


    <!-- =================================
         TASK 4
    ================================== -->

    <section>

        <h2>4. 🎵 Spotify Playlist</h2>

        <select id="genre">

            <option value="">
                Select Genre
            </option>

            <option value="pop">
                Pop
            </option>

            <option value="rock">
                Rock
            </option>

            <option value="jazz">
                Jazz
            </option>

        </select>

        <div id="songs">
            Select a genre to see songs.
        </div>

    </section>

</div>


<script>

$(document).ready(function () {


    // =========================================
    // TASK 1
    // Go Online
    // =========================================

    $("#goOnline").click(function () {

        $("#status")
            .text("You are now online!")
            .css("background-color", "green")
            .css("color", "white");

    });


    // =========================================
    // TASK 2
    // Restaurant Search
    // =========================================

    $("#search").keyup(function () {

        // Get search value
        let searchText = $(this).val().toLowerCase();


        // Check every restaurant
        $(".restaurant").each(function () {

            // Get restaurant name
            let restaurantName =
                $(this).text().toLowerCase();


            // If name contains search text
            if (restaurantName.includes(searchText)) {

                $(this).show();

            } else {

                $(this).hide();

            }

        });

    });


    // =========================================
    // TASK 3
    // Product Details
    // =========================================

    $("#showDetails").click(function () {

        // Add description
        $("#description").html(`
            <strong>Product Details:</strong><br>
            Wireless headphones with clear sound,
            Bluetooth connectivity and long battery life.
        `);

        // Show / Hide description
        $("#description").slideToggle();

    });


    // =========================================
    // TASK 4
    // Playlist
    // =========================================

    $("#genre").change(function () {

        // Get selected genre
        let genre = $(this).val();


        // POP
        if (genre === "pop") {

            $("#songs").html(`

                <div class="song">
                    🎵 Shape of You - Ed Sheeran
                </div>

                <div class="song">
                    🎵 Levitating - Dua Lipa
                </div>

                <div class="song">
                    🎵 Blinding Lights - The Weeknd
                </div>

            `);

        }


        // ROCK
        else if (genre === "rock") {

            $("#songs").html(`

                <div class="song">
                    🎸 Believer - Imagine Dragons
                </div>

                <div class="song">
                    🎸 Numb - Linkin Park
                </div>

                <div class="song">
                    🎸 It's My Life - Bon Jovi
                </div>

            `);

        }


        // JAZZ
        else if (genre === "jazz") {

            $("#songs").html(`

                <div class="song">
                    🎷 Take Five - Dave Brubeck
                </div>

                <div class="song">
                    🎷 Feeling Good - Nina Simone
                </div>

                <div class="song">
                    🎷 What a Wonderful World - Louis Armstrong
                </div>

            `);

        }


        // Nothing selected
        else {

            $("#songs").html(
                "Select a genre to see songs."
            );

        }

    });

});

</script>

</body>
</html>
